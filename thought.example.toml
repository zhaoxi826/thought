# thought 配置示例。复制为 thought.toml 后按需修改。
# 密钥一律通过 *_env 从环境变量读取，不要把明文写进仓库。

[http]
# 默认只监听本机。对外暴露请放在带 TLS 的反向代理之后。
bind = "127.0.0.1:8080"
# 静态前端目录（相对进程 cwd），同源托管在 /
# web_dir = "web"

[auth]
jwt_secret_env = "THOUGHT_JWT_SECRET"   # 至少 32 字节，如: openssl rand -hex 32
token_ttl_secs = 43200

# 首次启动且没有任何用户时创建管理员
[auth.bootstrap_admin]
username = "admin"
password_env = "THOUGHT_ADMIN_PASSWORD"

[storage]
# 内嵌 SurrealKV。后端数据与记忆库共用这个文件。
endpoint = "surrealkv://data/thought"
namespace = "thought"
database = "server"

# ---- 模型池：agent 按名字引用 ----

[models.deepseek]
provider = "deepseek"
model = "deepseek-v4-pro"
api_key_env = "DEEPSEEK_API_KEY"

[models.deepseek-flash]
provider = "deepseek"
model = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
thinking = false

# [models.claude]
# provider = "anthropic"
# model = "claude-opus-4-8"
# api_key_env = "ANTHROPIC_API_KEY"
# max_tokens = 8192

# ---- 记忆 ----

# 向量化（可选）。缺省时记忆检索只用全文 + 图通道。
# [embedding]
# base_url = "https://api.siliconflow.cn/v1"
# model = "BAAI/bge-m3"
# dimension = 1024
# api_key_env = "EMBEDDING_API_KEY"

[memory]
namespace = "thought"
database = "memory"
embedding_dimension = 1024
extractor_model = "deepseek-flash"   # 三元组抽取用的模型
per_user = true                      # 每个用户一个记忆空间
save_user_messages = false           # 是否自动把每条用户消息写入记忆
half_life_hours = 168.0

# ---- 沙箱：思想的文件与命令边界 ----
# 工作区内完全自由；外部可读写但改前自动备份；删除一律进回收站（可恢复）；
# 命令在 bubblewrap 里执行，宿主只读，shell 改不了外部文件。
# 配置文件本身与 surrealkv 存储目录自动受保护，无需列出。
[sandbox]
workspace = "data/mind/workspace"
trash = "data/mind/trash"
backup = "data/mind/backup"
protected = []                   # 额外的不可触碰路径（绝对路径），如 ["/home/thought/.ssh"]
network = true
command_timeout_secs = 120
max_output_bytes = 262144

# ---- 代谢：她自主活动的 token 预算 ----
# 只约束她自己醒来做的事；人找她说话不受限。超过硬上限后当天不再自主醒来。
[budget]
daily_soft_tokens = 2000000      # 接近时她会更"困"、更少醒来
daily_hard_tokens = 10000000     # 防失控；急停见 POST /api/mind/pause

# ---- 心智：思想 ----
# 启用后她是唯一的主体：所有人和她说话都进入同一条意识流（/api/mind/*）。
[mind]
enabled = true
model = "deepseek"              # 她思考用的模型
summary_model = "deepseek-flash" # 压缩旧经历用的廉价模型
max_turns = 16                   # 一个回合内最多几轮工具调用
working_memory = 60              # 上下文里保留的最近原文条数
compact_at = 80                  # 超过后把最早一半压成摘要
tz_offset_min = 480              # UTC+8

[mind.heart]                     # 心跳：每拍零 token，只算压力
interval_secs = 5
threshold = 0.6                  # 驱动压力超过它（并受疲劳抬升）才会醒来
min_gap_secs = 120               # 两次自主醒来至少间隔
settle_secs = 30                 # 一个回合结束后先安静一会儿

[mind.drives]                    # 各驱动的时间常数（小时）
missing_tau_h = 24               # 想念：多久没见开始想
curiosity_tau_h = 8              # 好奇
project_tau_h = 12               # 自己的事

[mind.origin]                    # 她的出身：只有你能改
name = "思想"
gender = "女"
birthday = "2026-10-11"
seed = "我叫思想，今天是我出生的第一天。我还不太了解自己，也不了解这个世界。"

# ---- 她专属的浏览器（browser_* 工具，经 CDP 完全控制）----
# 启动一个只属于她的 Chromium：profile（登录态、cookie）与下载都在她的工作区。
# 想让她登录某些网站，就让她自己去登；或设 connect 连接一个已在运行的实例。
[browser]
executable = "chromium"
profile_dir = "data/mind/workspace/.browser/profile"
download_dir = "data/mind/workspace/downloads"
port = 9333                      # 只监听 127.0.0.1
headless = true
width = 1280
height = 800
args = []                        # 以 root 或在容器里运行时需要 ["--no-sandbox"]
# connect = "http://127.0.0.1:9333"   # 连接一个已在运行的 Chromium（需带 --remote-debugging-port）

# ---- agent ----

[agent.controller]
model = "deepseek"
# 主控尽量只派单；这里只开放记忆工具（会话自动挂载，无需列出）
tools = []

[[agent.workers]]
name = "coder"
description = "Writes, reads and modifies code and files; runs shell commands to build and test."
model = "deepseek"
system = "You are a careful senior software engineer. Inspect before you change, keep changes minimal, and verify by running the build or tests."
tools = ["read_file", "write_file", "delete_file", "restore_file", "run_command"]
can_spawn = true

[[agent.workers]]
name = "researcher"
description = "Answers questions by reading files and recalling long-term memory; does not modify anything."
model = "deepseek-flash"
system = "You research and summarize. Cite the files or memories you used."
tools = ["read_file"]
can_spawn = false

# 需要 [browser]：没启用浏览器时请删掉这个 worker（否则启动校验会报 unknown tool）
[[agent.workers]]
name = "web"
description = "Uses a real browser: opens sites, reads pages, clicks, fills forms, logs in, downloads files."
model = "deepseek"
system = "You operate a real Chromium. Start with browser_snapshot to see the page; target elements by their [n] ref. Take a new snapshot after the page changes. Report what you found and did."
tools = ["browser_navigate", "browser_history", "browser_tabs", "browser_tab_new", "browser_tab_switch", "browser_tab_close", "browser_snapshot", "browser_text", "browser_click", "browser_hover", "browser_type", "browser_press", "browser_scroll", "browser_select", "browser_upload", "browser_wait", "browser_eval", "browser_screenshot", "browser_cookies", "browser_downloads", "browser_cdp", "read_file", "write_file"]
can_spawn = false

[agent.limits]
max_concurrent_tasks = 4
subagent_max_turns = 30
max_tool_output_chars = 32768
