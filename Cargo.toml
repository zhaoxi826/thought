[workspace]
resolver = "3"

members = ["agent", "browser", "mind", "model", "plugin", "sandbox", "server", "symbol", "thought-core"]


[workspace.dependencies]
tokio = { version = "1.52.3", features = ["full"] }
tokio-test = {version = "0.4.5"}

reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
futures = "0.3.32"
async-trait = "0.1.83"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
surrealdb = { version = "=3.3.1", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
sha2 = "0.10.9"
axum = "0.8.9"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
argon2 = "0.6.0"
uuid = { version = "1.27.0", features = ["v4"] }
toml = "1.1.7"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.28.0"
base64 = "0.22.1"
tower-http = { version = "0.6", features = ["fs"] }

model = {path = "model"}
agent = {path = "agent"}
plugin = {path = "plugin"}
server = {path = "server"}
symbol = {path = "symbol"}
sandbox = {path = "sandbox"}
mind = {path = "mind"}
browser = {path = "browser"}
thought-core = {path = "thought-core"}
# 发布用：cargo build --profile dist -p thought-core
[profile.dist]
inherits = "release"
strip = true
lto = "thin"
codegen-units = 1

# 开发构建：依赖不带调试信息（SurrealDB 体积大，否则 target/ 很快涨到 25G+ 撑满 /data）
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
